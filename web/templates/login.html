<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="login-top-right">
    <a class="link-btn" id="linkWebsite" href="/goto/w" target="_blank">🌐</a>
    <a class="link-btn" id="linkEmail" href="/goto/e">✉️</a>
    <a class="link-btn" id="linkTeams" href="/goto/t" target="_blank">👥</a>
    <button class="link-btn" onclick="showQQGroup()">💬</button>
    <button class="lang-btn-login" onclick="switchLang()">🌐 <span id="langLabel">EN</span></button>
  </div>
  <h1>{{.Title}}</h1>
  <form id="loginForm">
    <input type="text" id="username" data-i18n-ph="ph.username" required autocomplete="username">
    <input type="password" id="password" data-i18n-ph="ph.password" required autocomplete="current-password">
    <button type="submit" data-i18n="btn.login">登录</button>
  </form>
  <p id="loginMsg" class="msg"></p>
</div>
<script>
// ===== Login page i18n =====
const i18n = {
  zh: {
    'ph.username': '用户名',
    'ph.password': '密码',
    'btn.login': '登录',
    'msg.fail': '登录失败',
    'msg.netErr': '网络错误',
  },
  en: {
    'ph.username': 'Username',
    'ph.password': 'Password',
    'btn.login': 'Login',
    'msg.fail': 'Login failed',
    'msg.netErr': 'Network error',
  }
};
const LANG = (() => {
  const s = localStorage.getItem('lang');
  if (s === 'zh' || s === 'en') return s;
  return (navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en';
})();
function T(k) { return (i18n[LANG] && i18n[LANG][k]) || i18n.zh[k] || k; }
function switchLang() {
  localStorage.setItem('lang', LANG === 'zh' ? 'en' : 'zh');
  location.reload();
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = T(el.getAttribute('data-i18n')));
  document.querySelectorAll('[data-i18n-ph]').forEach(el => el.setAttribute('placeholder', T(el.getAttribute('data-i18n-ph'))));
  document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('langLabel').textContent = LANG === 'zh' ? 'EN' : '中文';
}
async function showQQGroup() {
  try {
    const res = await fetch('/goto/q');
    const qq = await res.text();
    alert('QQ群号: ' + qq);
  } catch(e) { alert('加载失败'); }
}
applyI18n();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const u = document.getElementById('username').value;
  const p = document.getElementById('password').value;
  const msg = document.getElementById('loginMsg');
  try {
    const res = await fetch('/api/admin/login?lang=' + LANG, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await res.json();
    if (data.token) {
      localStorage.setItem('token', data.token);
      window.location.href = '/dashboard';
    } else {
      msg.textContent = data.message || T('msg.fail');
      msg.style.color = '#e74c3c';
    }
  } catch(err) {
    msg.textContent = T('msg.netErr');
    msg.style.color = '#e74c3c';
  }
});
</script>
</body>
</html>
